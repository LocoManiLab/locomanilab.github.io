name: Activate completed policy rollouts

on:
  push:
    branches: [main]
    paths: [hosting/migration/activation-request.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rollout-activation
  cancel-in-progress: false

jobs:
  wait-1:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          node scripts/sync-release-proof.mjs --wait-ms 10800000

  wait-2:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-1
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-1.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-1.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-3:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-2
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-2.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-2.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-4:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-3
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-3.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-3.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-5:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-4
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-4.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-4.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-6:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-5
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-5.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-5.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-7:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-6
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-6.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-6.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-8:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-7
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-7.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-7.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-9:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-8
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-8.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-8.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-10:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-9
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-9.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-9.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-11:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-10
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-10.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-10.outputs.ready }}' = 'true' ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/sync-release-proof.mjs --wait-ms 10800000
          fi

  wait-12:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    needs: wait-11
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - name: Check out latest Pages source
        uses: actions/checkout@v6
        if: needs.wait-11.outputs.ready != 'true'
        with:
          ref: main
      - name: Wait for complete public proof
        id: proof
        run: |
          if [ '${{ needs.wait-11.outputs.ready }}' = 'true' ]; then
